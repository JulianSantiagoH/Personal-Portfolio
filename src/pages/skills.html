<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <div class="container">
        <div class="slidebar-father">

                    <button class="burger-button" id="hiddenSlidebar"><img src="../assets/icons/burger-menu-icon.svg"
                            alt="MenuButton" title="MenuButton"></button>
                </div>
                <div class="data-user-profile">
                    <div class="profile-container-slidebar">
                        <img class="img-profile-slidebar" style="width: 100px;" src="../assets/img/pictureProfile.jpg"
                            alt="user photo" title="user photo">
                    </div>
                    <h1 class="title-profile-slidebar">Jhon Doe</h1>
                    <p class="description-profile-slidebar">Full Stack Developer</p>
                    <div class="border-profile-slidebar"></div>
                </div>
                <div class="nav-menu">
                    <a href="../index.html"><button class="button-menu"><img class="icon-menu"
                                src="../assets/icons/home-icon.svg" alt="Home" title="Home Image">Home</button></a>
                    <a href="./about.html" class="hoverButton"><button class="button-menu"><img class="icon-menu"
                                src="../assets/icons/about-icon.svg" alt="About me" title="About Image">About

                    <a href="./skills.html"><button class="button-menu"><img class="icon-menu"
                                src="../assets/icons/code-icon.svg" alt="Skills"
                                title="Skills Image">Skills</button></a>
                    <a href="./project.html"><button class="button-menu"><img class="icon-menu" src="../assets/icons/project-icon.svg"

                </div>
            </div>

            <div class="background-dark hidden-slidebar" id="bgDark"></div>
        </div>
